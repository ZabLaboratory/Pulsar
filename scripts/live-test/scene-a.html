<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pulsar — SCENE A</title>
<!-- ─────────────────────────────────────────────────────────────────────────
     SCENE A  (probe-twitch-scene-switch)

     Deliberately minimal + SILENT. Unlike test-scene.html this page contains
     NO Web Audio (no AudioContext, no __pulsarSfx), NO React/Babel, NO
     telemetry WebSocket — it is a single static frame whose ONLY job is to be
     a large, unambiguous, visually-distinct fill that proves a scene switch on
     the live wire to the eye. SCENE A is COBALT BLUE; scene-b.html is its
     CRIMSON twin. A reviewer scrubbing the VOD sees blue → red at the switch.

     "Zero PC sound" strategy: this page makes no sound at all. There is no
     <audio>, no oscillator, no media element. Combined with the probe muting
     the desktop-audio source and never wiring mic/process audio, the broadcast
     carries a silent AAC track.
─────────────────────────────────────────────────────────────────────────── -->
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: #0a2a6b;                       /* cobalt blue */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #eaf0ff;
  }
  #root {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2vh;
    background:
      radial-gradient(circle at 50% 35%, rgba(80,140,255,0.45), transparent 60%),
      #0a2a6b;
  }
  .label {
    font-size: 18vh; font-weight: 800; letter-spacing: 0.04em;
    text-shadow: 0 0 6vh rgba(120,170,255,0.6);
  }
  .sub  { font-size: 4vh; font-weight: 500; opacity: 0.82; letter-spacing: 0.3em; }
  .dot  {
    width: 2.2vh; height: 2.2vh; border-radius: 50%;
    background: #ff453a; box-shadow: 0 0 2vh #ff453a;
    animation: blink 1.4s ease-in-out infinite;
  }
  .live { display: flex; align-items: center; gap: 1.4vh; font-size: 3vh; font-weight: 700; letter-spacing: 0.2em; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>
<div id="root">
  <div class="label">SCENE A</div>
  <div class="sub">COBALT · PULSAR</div>
  <div class="live"><span class="dot"></span>LIVE</div>
</div>
</body>
</html>
