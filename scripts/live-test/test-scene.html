<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pulsar live-test scene</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0d0d11;
    color: #fff; font-family: ui-monospace, "JetBrains Mono", monospace;
  }
  #stage {
    position: relative; width: 100vw; height: 100vh;
    display: grid; grid-template-rows: auto 1fr auto; gap: 24px; padding: 32px;
    box-sizing: border-box;
  }
  /* Animated background — gradient that moves at 60fps. Smooth motion
     is the visual signal for "encoder is feeding the right framerate". */
  #stage::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(135deg,
      hsl(220 70% 6%), hsl(280 60% 12%), hsl(220 70% 6%));
    background-size: 200% 200%;
    animation: drift 6s ease-in-out infinite;
  }
  @keyframes drift {
    0%   { background-position:   0%   0% }
    50%  { background-position: 100% 100% }
    100% { background-position:   0%   0% }
  }
  header {
    display: flex; align-items: center; gap: 24px;
    font-size: 32px; font-weight: 700; letter-spacing: -0.5px;
  }
  .live-dot {
    width: 18px; height: 18px; border-radius: 50%;
    background: #ff3b3b; box-shadow: 0 0 24px #ff3b3b;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1) }
    50%      { opacity: 0.4; transform: scale(0.85) }
  }
  main {
    display: grid; grid-template-columns: 1fr 1fr; gap: 32px;
    align-items: center; justify-items: center;
  }
  /* Spinning cube — visible markers across frames, drives the
     "frame pacing looks right" check that a human reviewing the
     Twitch VOD makes. */
  .cube-wrap { perspective: 1200px; }
  .cube {
    width: 240px; height: 240px; position: relative;
    transform-style: preserve-3d;
    animation: spin 4s linear infinite;
  }
  @keyframes spin {
    0%   { transform: rotateX(0deg) rotateY(0deg) }
    100% { transform: rotateX(360deg) rotateY(360deg) }
  }
  .face {
    position: absolute; inset: 0;
    border: 2px solid rgba(155, 179, 255, 0.8);
    background: rgba(155, 179, 255, 0.12);
    color: #9bb3ff;
    display: grid; place-items: center; font-size: 96px; font-weight: 800;
  }
  .f-front  { transform: translateZ(120px); }
  .f-back   { transform: rotateY(180deg) translateZ(120px); }
  .f-right  { transform: rotateY(90deg) translateZ(120px); }
  .f-left   { transform: rotateY(-90deg) translateZ(120px); }
  .f-top    { transform: rotateX(90deg) translateZ(120px); }
  .f-bottom { transform: rotateX(-90deg) translateZ(120px); }
  /* Stats — frame counter + timestamp + audio-pulse indicator. */
  .stats {
    font-size: 28px; line-height: 1.6;
    background: rgba(0,0,0,0.4); padding: 24px 32px; border-radius: 12px;
    min-width: 460px;
  }
  .stats .label { color: #888; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
  .stats .value { color: #fff; font-variant-numeric: tabular-nums; }
  .audio-bar {
    height: 8px; background: rgba(155,179,255,0.15); border-radius: 4px;
    overflow: hidden; margin-top: 8px;
  }
  .audio-bar-fill {
    height: 100%; background: linear-gradient(90deg, #3aa874, #9bb3ff);
    width: 0%; transition: width 0.1s ease-out;
  }
  footer {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px; opacity: 0.6;
  }
</style>
</head>
<body>
<div id="stage">
  <header>
    <span class="live-dot" aria-hidden></span>
    <span>PULSAR LIVE TEST</span>
  </header>

  <main>
    <div class="cube-wrap">
      <div class="cube">
        <div class="face f-front">P</div>
        <div class="face f-back">U</div>
        <div class="face f-right">L</div>
        <div class="face f-left">S</div>
        <div class="face f-top">A</div>
        <div class="face f-bottom">R</div>
      </div>
    </div>
    <div class="stats">
      <div><span class="label">Frame</span> &nbsp;<span class="value" id="frame">0</span></div>
      <div><span class="label">Elapsed</span> <span class="value" id="elapsed">0.000s</span></div>
      <div><span class="label">FPS</span>   <span class="value" id="fps">--</span></div>
      <div style="margin-top:16px">
        <span class="label">Audio sine 440 Hz · pulse every 5s</span>
        <div class="audio-bar"><div class="audio-bar-fill" id="audiobar"></div></div>
      </div>
    </div>
  </main>

  <footer>
    <span>scene-server :: live-test fixture</span>
    <span id="when">--</span>
  </footer>
</div>
<script>
  // Frame counter + measured FPS, smoothed over the last second.
  // Visible on the broadcast so a human + automated pipeline can
  // verify the 60 fps target is held.
  const elFrame   = document.getElementById('frame');
  const elElapsed = document.getElementById('elapsed');
  const elFps     = document.getElementById('fps');
  const elWhen    = document.getElementById('when');
  const elBar     = document.getElementById('audiobar');

  const start = performance.now();
  const timestamps = [];
  let frame = 0;

  function tick(now) {
    frame += 1;
    const elapsed = (now - start) / 1000;
    timestamps.push(now);
    while (timestamps.length && timestamps[0] < now - 1000) timestamps.shift();
    elFrame.textContent   = frame.toLocaleString();
    elElapsed.textContent = elapsed.toFixed(3) + 's';
    elFps.textContent     = timestamps.length.toString();
    elWhen.textContent    = new Date().toISOString();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Audio probe : a 440 Hz sine wave that pulses for 1s every 5s.
  // Validates the `reroute_audio` path end-to-end : if the pulse is
  // visible on the published audio (via ffprobe of the resulting
  // VOD or a Twitch-side listener), the audio routing through
  // obs-browser → libobs → encoder works.
  let audioReady = false;
  function startAudio() {
    if (audioReady) return;
    audioReady = true;
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 440;
    osc.type = 'sine';
    gain.gain.value = 0;
    osc.connect(gain).connect(ctx.destination);
    osc.start();

    // Pulse envelope : 1s on, 4s off. Keep amplitude moderate (0.25)
    // so it doesn't over-saturate Twitch's loudness gating.
    setInterval(() => {
      const t = ctx.currentTime;
      gain.gain.cancelScheduledValues(t);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.25, t + 0.05);
      gain.gain.setValueAtTime(0.25, t + 1.0);
      gain.gain.linearRampToValueAtTime(0, t + 1.05);
    }, 5000);

    // Animate the visible audio bar so even a muted player sees
    // the pulse cadence.
    setInterval(() => {
      elBar.style.width = '100%';
      setTimeout(() => { elBar.style.width = '0%'; }, 1000);
    }, 5000);
  }

  // CEF / obs-browser allows audio without a user gesture. Start
  // immediately when the page loads.
  startAudio();
</script>
</body>
</html>
