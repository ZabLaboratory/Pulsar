# Pulsar -- release on tag push.
#
# Trigger: push of a vX.Y.Z tag (matches `v*.*.*`) OR a manual
# workflow_dispatch run for dry-run validation.
#
# What it does:
#   1. Checks out the repo + initialises every submodule recursively
#      (upstream/, libdshowcapture, obs-browser, obs-websocket).
#   2. Runs scripts/build-win.ps1 which compiles libobs + every Pulsar
#      plugin against the windows-x64 preset.
#   3. Runs scripts/package-win.ps1 -Zip which produces
#      dist/pulsar-windows-x64-v<VERSION>/ and a same-named .zip.
#   4. On tag push, attaches the .zip to the GitHub Release.
#      On manual run, uploads the .zip as a workflow artifact instead.
#
# First runs of this workflow on a fresh GitHub Actions Windows runner
# may fail on toolchain or obs-deps download nuances. The workflow is
# designed to be re-runnable: scripts/build-win.ps1 is idempotent on the
# patch+configure side and skips redownloading obs-deps if .deps/
# is populated.

name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-package:
    name: build-and-package (windows-x64)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Pulsar version: $v"

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $expected = "v${{ steps.version.outputs.version }}"
          if ($tag -ne $expected) {
            Write-Error "Tag $tag does not match VERSION ($expected). Bump VERSION in the same commit as the tag."
            exit 1
          }

      - name: Configure git identity
        # build-win.ps1 calls `git am` to apply patches/ onto the
        # upstream/ submodule. `git am` writes a commit, which requires
        # a configured user.name / user.email -- absent on a fresh
        # GitHub Actions runner, hence the v0.1.0 build failed at this
        # step on first try. The values are scoped to this checkout
        # only; nothing about the published commits changes.
        shell: pwsh
        run: |
          git config --global user.email "ci@pulsar.zablaboratory"
          git config --global user.name "Pulsar CI"

      - name: Install CMake 3.28+
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.30.0'

      - name: Setup MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (build-win.ps1)
        shell: pwsh
        run: |
          # Don't pass -CI: that switches the *configure* preset to
          # windows-ci-x64, but upstream's CMakePresets.json defines no
          # matching *build* preset (only windows-x64 / windows-arm64),
          # so `cmake --build --preset windows-ci-x64` errors out with
          # "No such build preset". Sticking to windows-x64 throughout
          # works on both local dev and the GitHub runner.
          ./scripts/build-win.ps1

      - name: Package (package-win.ps1 -Zip)
        shell: pwsh
        run: |
          ./scripts/package-win.ps1 -Zip -SkipBuild

      - name: List artefacts
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length

      # On tag push: publish to GitHub Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pulsar-windows-x64-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      # On manual dispatch: keep the zip as a workflow artifact
      - name: Upload artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-windows-x64-v${{ steps.version.outputs.version }}
          path: dist/pulsar-windows-x64-v${{ steps.version.outputs.version }}.zip
          retention-days: 14
